<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chill•Mod - Unlock</title>
    <style>
        /* Cài đặt cơ bản */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Khung điện thoại giả lập */
        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            height: 100vh;
            max-height: 850px;
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Phần Header */
        .header {
            background-color: #777777;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            color: #a855f7;
            font-size: 20px;
        }

        .flag-icon {
            width: 28px;
            height: 28px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        /* Phần Nội dung chính (Card) */
        .main-content {
            flex: 1;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            overflow-y: auto;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #888888;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Các nút nhiệm vụ */
        .task-btn {
            width: 100%;
            padding: 16px 20px;
            border-radius: 50px;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .task-btn:active {
            transform: scale(0.97);
        }

        .task-btn-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-box {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .arrow-icon {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Màu sắc từng nút */
        .btn-tiktok {
            background: linear-gradient(135deg, #ff0050, #ff4d4d);
            box-shadow: 0 5px 20px rgba(255, 0, 80, 0.3);
        }

        .btn-youtube {
            background: linear-gradient(135deg, #ff0000, #ff4d4d);
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.3);
        }

        /* Trạng thái đã hoàn thành */
        .task-btn.completed {
            background: #e0e0e0;
            color: #888;
            box-shadow: none;
            pointer-events: none;
        }
        
        .task-btn.completed .icon-box {
            background: rgba(0,0,0,0.05);
            color: #4caf50;
        }

        /* Thanh tiến trình */
        .progress-section {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .progress-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng sọc sọc cho thanh tiến trình giống hình */
        .progress-bar-bg::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(45deg,rgba(0,0,0,.05) 25%,transparent 25%,transparent 50%,rgba(0,0,0,.05) 50%,rgba(0,0,0,.05) 75%,transparent 75%,transparent);
            background-size: 20px 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: #a855f7; /* Màu tím giống nút Telegram trong hình */
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
            z-index: 1;
        }

        /* Nút Download / Unlock */
        .unlock-btn {
            width: 100%;
            padding: 18px 20px;
            border-radius: 50px;
            border: none;
            background-color: #bdf0d0; /* Màu xanh nhạt giống hình */
            color: #ffffff; /* Màu chữ trắng khi bị khóa */
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: not-allowed;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .unlock-btn.active {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .unlock-btn.active:active {
            transform: scale(0.97);
        }

        .unlock-btn .icon-box {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Phần Footer */
        .footer {
            background-color: #777777;
            padding: 20px;
            text-align: center;
            color: #d1d1d1;
            font-size: 13px;
        }

        /* Thông báo Toast */
        .toast {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* FontAwesome Icons (Sử dụng SVG inline để không cần tải mạng) */
        svg { width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="header-icon">⚠️</span>
            <span>Chill•Mod</span>
        </div>
        <div class="flag-icon">
            🇻🇳
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="title">Nhiệm Vụ Mở Khóa</h1>
        <p class="subtitle">Hoàn thành 2 bước để tải file</p>

        <!-- Bước 1: TikTok -->
        <button class="task-btn btn-tiktok" id="task-tiktok" onclick="completeTask('tiktok')">
            <div class="task-btn-left">
                <div class="icon-box">
                    <!-- Icon TikTok -->
                    <svg viewBox="0 0 448 512"><path d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a74.62,74.62,0,1,0,52.23,71.18V0l88,0a121.18,121.18,0,0,0,1.86,22.17h0A122.18,122.18,0,0,0,381,102.39a121.43,121.43,0,0,0,67,20.14Z"/></svg>
                </div>
                Bước 1: Follow TikTok
            </div>
            <span class="arrow-icon">❯</span>
        </button>

        <!-- Bước 2: YouTube -->
        <button class="task-btn btn-youtube" id="task-youtube" onclick="completeTask('youtube')">
            <div class="task-btn-left">
                <div class="icon-box">
                    <!-- Icon YouTube -->
                    <svg viewBox="0 0 576 512"><path d="M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305zm-317.51 213.508V175.185l142.739 81.205-142.739 81.201z"/></svg>
                </div>
                Bước 2: Đăng Kí Youtube
            </div>
            <span class="arrow-icon">❯</span>
        </button>

        <!-- Tiến trình -->
        <div class="progress-section">
            <div class="progress-text" id="progress-text">Tiến trình mở khoá 0/2</div>
            <div class="progress-bar-bg">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Nút Tải File -->
        <button class="unlock-btn" id="unlock-btn" onclick="downloadFile()">
            <div class="task-btn-left">
                <div class="icon-box">
                    <!-- Icon Ổ khóa -->
                    <svg id="lock-icon" viewBox="0 0 448 512"><path d="M400 224h-24v-72C376 68.2 307.8 0 224 0S72 68.2 72 152v72H48c-26.5 0-48 21.5-48 48v192c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V272c0-26.5-21.5-48-48-48zm-104 0H152v-72c0-39.7 32.3-72 72-72s72 32.3 72 72v72z"/></svg>
                </div>
                <span id="unlock-text">Tải File Mod Skin</span>
            </div>
            <span class="arrow-icon">❯</span>
        </button>
    </div>

    <!-- Footer ĐÃ ĐƯỢC CHỈNH SỬA -->
    <div class="footer">
        © 2026 Chill•Mod - All Rights Reserved.
    </div>

    <!-- Thông báo -->
    <div class="toast" id="toast">Thông báo</div>
</div>

<script>
    // Biến lưu trạng thái
    let tasks = {
        tiktok: false,
        youtube: false
    };

    // Hàm hiển thị thông báo (Toast)
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }

    // Hàm xử lý khi click vào nhiệm vụ
    function completeTask(taskName) {
        if (tasks[taskName]) return; // Nếu đã làm rồi thì bỏ qua

        // Giả lập việc chuyển hướng đến link (Bạn có thể thay link thật vào đây)
        if (taskName === 'tiktok') {
            window.open('https://www.tiktok.com/@chill_modd', '_blank'); // Thay link TikTok của bạn
            showToast("Đã mở TikTok, hãy Follow nhé!");
        } else if (taskName === 'youtube') {
            window.open('https://youtube.com/@chill_modd', '_blank'); // Thay link Youtube của bạn
            showToast("Đã mở YouTube, hãy Đăng Ký nhé!");
        }

        // Đánh dấu hoàn thành
        tasks[taskName] = true;
        
        // Cập nhật giao diện nút
        const btn = document.getElementById(`task-${taskName}`);
        btn.classList.add('completed');
        btn.innerHTML = `
            <div class="task-btn-left">
                <div class="icon-box">✔</div>
                Đã hoàn thành
            </div>
        `;

        updateProgress();
    }

    // Hàm cập nhật thanh tiến trình
    function updateProgress() {
        let completedCount = 0;
        if (tasks.tiktok) completedCount++;
        if (tasks.youtube) completedCount++;

        const totalTasks = 2;
        
        // Cập nhật text
        document.getElementById('progress-text').textContent = `Tiến trình mở khoá ${completedCount}/${totalTasks}`;
        
        // Cập nhật thanh bar
        const percentage = (completedCount / totalTasks) * 100;
        document.getElementById('progress-fill').style.width = `${percentage}%`;

        // Nếu hoàn thành hết 2 bước
        if (completedCount === totalTasks) {
            const unlockBtn = document.getElementById('unlock-btn');
            unlockBtn.classList.add('active');
            
            // Đổi icon ổ khóa thành icon tải xuống
            document.getElementById('lock-icon').innerHTML = '<path d="M216 0h80c13.3 0 24 10.7 24 24v168h87.7c17.8 0 26.7 21.5 14.1 34.1L269.7 378.3c-7.5 7.5-19.8 7.5-27.3 0L90.1 226.1c-12.6-12.6-3.7-34.1 14.1-34.1H192V24c0-13.3 10.7-24 24-24zm296 376v112c0 13.3-10.7 24-24 24H24c-13.3 0-24-10.7-24-24V376c0-13.3 10.7-24 24-24h146.7l49 49c20.1 20.1 52.5 20.1 72.6 0l49-49H488c13.3 0 24 10.7 24 24zm-124 88c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20zm64 0c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20z"/>';
            
            document.getElementById('unlock-text').textContent = "Tải File Ngay";
            showToast("Tuyệt vời! Bạn đã có thể tải file.");
        }
    }

    // Hàm xử lý tải file
    function downloadFile() {
        if (tasks.tiktok && tasks.youtube) {
            // Thay link tải file của bạn vào đây
            window.location.href = 'https://t.me/share_ioss';
            showToast("Đang bắt đầu tải file...");
        } else {
            showToast("Vui lòng hoàn thành đủ 2 bước!");
        }
    }
</script>

</body>
</html>
